# ============================================================
# 大模型 API 配置模板（OpenAI 兼容协议，任选一家服务商）
# ------------------------------------------------------------
# 用法：
#   1. 复制本文件为 ai_config.local.ini（已被 .gitignore 忽略，不会提交）
#   2. 填入你自己的 api_key
#   3. 运行 ./push_ai_config.sh 推送到音箱
#
# ⚠️ ai_config.local.ini 含你的私人 Key，永远不要提交到 git！
# ============================================================

[AI]
# 通用字段，两种服务商都一样
provider = openai
temperature = 0.7
max_tokens = 1024
config_version = 5

# ── 声音与话题（v87 新增）─────────────────────────────────
# tts: 回答用什么声音读
#   空 / factory → 原厂 TTS（默认，依赖音箱自带引擎，最稳）
#   doubao       → 豆包自己的声音（需要 base_url 指向局域网豆包链，见方案四）
#   （v88 起讯飞 TTS 已移除，只有上面两种）
tts =
# user: 豆包链按这个 id 分话题，同一个 id 跨轮复用同一个豆包会话（有连续记忆）。
#       换一个 id = 在豆包那边另起一个话题。调侃固定走 r1-teaser，不用管。
user = r1-speaker

# ── 方案一：智谱 GLM-4.5-Flash（默认方案，免费，推荐开源用户使用）──
# 注册: https://bigmodel.cn  → API Keys → 生成 Key（形如 id.secret 两段，都要复制）
base_url = https://open.bigmodel.cn/api/paas/v4/chat/completions
model = GLM-4.5-Flash
# disabled=关闭深度思考（语音交互追求秒回，务必关闭）
thinking = disabled

# ── 方案二：火山方舟豆包（示例：Doubao-Seed-2.0-lite，付费/有免费额度）──
# 注册: https://console.volcengine.com/ark → API Key 管理 → 生成 Key（UUID 形式）
# base_url = https://ark.cn-beijing.volces.com/api/v3/chat/completions
# model = doubao-seed-2-0-lite-260215
# thinking = disabled

# ── 方案三：任意 OpenAI 兼容端点（DeepSeek / Kimi / OpenAI / 本地 Ollama 等）──
# base_url = https://api.deepseek.com/chat/completions
# model = deepseek-chat
# thinking = auto   # 非智谱端点用 auto（表示不发送 thinking 字段）

# ── 方案四：自建豆包链（局域网里的另一台机器跑 doubao-server + llm_bridge 门）──
# 好处: 对话和语音都用豆包网页端自己的声音（陶子女声），不走官方 API、不花 token。
# 代价: 那台机器必须常开；豆包登录态约 27 天，过期要扫码续。
# base_url = http://192.168.5.176:7790/v1/chat/completions
# model = doubao
# thinking = auto
# tts = doubao          # 让服务端顺带把这条回答用豆包的声音合成回来
# api_key = 门上的 bridge.key（在那台机器的 creds/bridge.key 里）

# api_key = 在这里填你的 Key（上面一行取消注释）

# ── 三级兜底链（可选，强烈建议配满）────────────────────────────
# 音箱按 L1 → L2 → L3 的顺序调，任何一级答上来就停：
#
#   L1  主端点（上面的 base_url）      —— 一般是豆包链，唯一有豆包音色的一级
#   L2  fallback_*                     —— 推荐火山方舟 Doubao-Seed-2.0-lite
#   L3  fallback2_*                    —— 推荐智谱 GLM-4.5-Flash（免费）
#
# 典型故障对应的落点：
#   局域网那台机器关机 / 豆包登录态过期 → L2（方舟豆包，公网直连）
#   方舟欠费 / Key 失效 / 网络不通      → L3（智谱 GLM）
#   三级全挂                            → 播"调用失败"
#
# ⚠️ L2/L3 拿不到豆包语音（语音只有豆包链才有），降级时自动改用音箱原厂 TTS 播报，
#    音色会变回原厂机器音——这是正常的降级表现，不是故障。
#
# 某一级没配 Key / 地址跟上一级重复 → 自动跳过，不浪费 15 秒连接超时。
# 某级挂掉后会被"封"5 分钟（5 分钟内不再试探它），避免用户每问一句都干等 15 秒。
#
# fallback_base_url = https://ark.cn-beijing.volces.com/api/v3/chat/completions
# fallback_api_key = 你的方舟 Key
# fallback_model = doubao-seed-2-0-lite-260215
#
# fallback2_base_url = https://open.bigmodel.cn/api/paas/v4/chat/completions
# fallback2_api_key = 你的智谱 Key
# fallback2_model = GLM-4.5-Flash
